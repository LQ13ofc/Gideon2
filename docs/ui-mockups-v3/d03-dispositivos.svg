>Configurações</text><g transform="translate(707.25 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></g><text x="733.25" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Diagnóstico</text><rect x="1262.05" y="13.5" width="101.45" height="29" rx="14.5" fill="#262C33" stroke="#373c43" stroke-width="1"/><circle cx="1273.55" cy="28" r="4" fill="#6BCB8B"/><text x="1285.55" y="32.5" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#E6E9EE">Em espera</text><rect x="1134.05" y="13.5" width="119" height="29" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><circle cx="1151.55" cy="27" r="4.5" fill="none" stroke="#A7B0BC" stroke-width="1.5"/><line x1="1155.05" y1="30.5" x2="1158.55" y2="34" stroke="#A7B0BC" stroke-width="1.5"/><text x="1169.55" y="32.5" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Ctrl+K</text><rect x="0" y="56" width="1380" height="44" fill="#121417"/><text x="36" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Voz e Wake</text><text x="152.85" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Áudio</text><text x="227.81" y="83" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Dispositivos</text><rect x="209.81" y="98" width="121.78" height="2" fill="#7693ff"/><text x="349.59" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Aparência</text><text x="454.74" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Privacidade</text><text x="572.36" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Geral</text><rect x="0" y="99" width="1380" height="1" fill="#373c43"/><text x="32" y="138" font-family="Noto Sans" font-size="24" font-weight="bold" fill="#E6E9EE">Dispositivos</text><text x="32" y="163" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Entrada e saída em uso: hoje virtuais. Dispositivos físicos ainda não existem.</text><rect x="32.5" y="184.5" width="1315" height="39" rx="10" fill="#1B1F24" stroke="#373c43" stroke-width="1"/><text x="48" y="209" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Entrada: PCM virtual · Saída: virtual · Câmera e tela: simuladas</text><rect x="140.5" y="236.5" width="541" height="259" rx="10" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="160" y="270" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Entrada (microfone)</text><text x="160" y="308" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Dispositivo em uso: PCM virtual</text><text x="160" y="336" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">PCM virtual · pré-roll de 1 segundo · processamento na CPU. Microfone físico,</text><text x="160" y="353" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">cancelamento de eco e redução de ruído ainda indisponíveis.</text><text x="160" y="386" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#A7B0BC">Microfone físico</text><g opacity="0.42"><rect x="160.5" y="394.5" width="299" height="39" rx="10" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="174" y="419" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Sem microfone físico</text><path d="M433 411.5 L438 416.5 L443 411.5" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="160" y="456" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Indisponível: adaptador de microfone físico não implementado; validação humana</text><text x="160" y="472" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">pendente.</text><rect x="698.5" y="236.5" width="541" height="259" rx="10" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="718" y="270" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Saída (alto-falante)</text><text x="718" y="308" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Dispositivo em uso: Saída virtual</text><text x="718" y="336" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Sem reprodução física comprovada.</text><text x="718" y="386" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#A7B0BC">Alto-falante físico</text><g opacity="0.42"><rect x="718.5" y="394.5" width="299" height="39" rx="10" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="732" y="419" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Sem alto-falante físico</text><path d="M991 411.5 L996 416.5 L1001 411.5" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="718" y="456" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Indisponível: adaptador de saída física não implementado.</text><rect x="140.5" y="516.5" width="1099" height="149" rx="10" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="160" y="550" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Câmera e tela</text><text x="160" y="590" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Câmera: simulada</text><rect x="289.43" y="575.5" width="85.26" height="21" rx="11" fill="#A7B0BC" fill-opacity="0.14" stroke="#A7B0BC" stroke-width="1" stroke-opacity="0.5"/><text x="298.93" y="590" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">SINTÉTICO</text><text x="160" y="610" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Indisponível: sem câmera real.</text><text x="160" y="638" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Tela: simulada</text><rect x="268.28" y="623.5" width="85.26" height="21" rx="11" fill="#A7B0BC" fill-opacity="0.14" stroke="#A7B0BC" stroke-width="1" stroke-opacity="0.5"/><text x="277.78" y="638" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">SINTÉTICO</text><text x="160" y="658" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Indisponível: sem captura de tela real.</text><rect x="930.84" y="596.5" width="288.66" height="39" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1075.17" y="621" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Ver em Extensões › Percepção e ação</text><rect x="140.5" y="682.5" width="1099" height="55" rx="10" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="158" y="707" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#E6E9EE">Como funciona</text><text x="158" y="727" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#A7B0BC">Entrada e saída são virtuais nesta versão. Dispositivos físicos entram quando o adaptador for validado.</text><path d="M1207 705 L1213 710 L1207 715" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>