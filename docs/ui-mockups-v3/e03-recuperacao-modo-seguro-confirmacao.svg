<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1088" viewBox="0 0 1380 1088"><defs><linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1F24"/><stop offset="1" stop-color="#20262c"/></linearGradient><radialGradient id="orbBase" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#c3d5fb"/><stop offset="0.5" stop-color="#7AA2F7"/><stop offset="1" stop-color="#3d517c"/></radialGradient><radialGradient id="orbLobeA" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#bddeff"/><stop offset="0.5" stop-color="#6CB6FF"/><stop offset="1" stop-color="#365b80"/></radialGradient><radialGradient id="orbLobeB" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#d6e2fa"/><stop offset="0.5" stop-color="#a5bef3"/><stop offset="1" stop-color="#525f7a"/></radialGradient><radialGradient id="orbErr" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#f8bfc2"/><stop offset="0.5" stop-color="#F07178"/><stop offset="1" stop-color="#78383c"/></radialGradient><radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7AA2F7" stop-opacity="0.45"/><stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/></radialGradient><radialGradient id="orbGlowErr" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F07178" stop-opacity="0.45"/><stop offset="1" stop-color="#F07178" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1380" height="1088" fill="#121417"/><rect x="0" y="0" width="1380" height="56" fill="#1B1F24"/><rect x="0" y="55" width="1380" height="1" fill="#373c43"/><circle cx="30" cy="28" r="18.9" fill="url(#orbGlow)"/><circle cx="30" cy="28" r="14" fill="url(#orbBase)"/><ellipse cx="27.2" cy="31.5" rx="7.7" ry="5.6" fill="url(#orbLobeA)" opacity="0.85"/><ellipse cx="34.2" cy="24.5" rx="7" ry="4.76" fill="url(#orbLobeB)" opacity="0.8"/><ellipse cx="26.5" cy="22.12" rx="4.9" ry="2.24" fill="#FFFFFF" opacity="0.28"/><text x="52" y="34" font-family="Noto Sans" font-size="16" font-weight="bold" fill="#E6E9EE">Gideon</text><g transform="translate(146 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-4.5 3.5V16H4z"/></g><text x="172" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Assistente</text><g transform="translate(278.38 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g><text x="304.38" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Extensões</text><g transform="translate(409.69 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v5.5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g><text x="435.69" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Permissões</text><g transform="translate(549.92 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.31 10.07 L21.06 10.40 L21.06 13.60 L18.31 13.93 L17.83 15.10 L19.54 17.28 L17.28 19.54 L15.10 17.83 L13.93 18.31 L13.60 21.06 L10.40 21.06 L10.07 18.31 L8.90 17.83 L6.72 19.54 L4.46 17.28 L6.17 15.10 L5.69 13.93 L2.94 13.60 L2.94 10.40 L5.69 10.07 L6.17 8.90 L4.46 6.72 L6.72 4.46 L8.90 6.17 L10.07 5.69 L10.40 2.94 L13.60 2.94 L13.93 5.69 L15.10 6.17 L17.28 4.46 L19.54 6.72 L17.83 8.90 Z"/><circle cx="12" cy="12" r="2.8"/></g><text x="575.92" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Configurações</text><rect x="693.25" y="8" width="169.05" height="40" rx="8" fill="#2c374a"/><rect x="693.25" y="53" width="169.05" height="3" rx="1.5" fill="#7AA2F7"/><g transform="translate(707.25 19) scale(0.75)" fill="none" stroke="#7AA2F7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></g><text x="733.25" y="33" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Diagnóstico</text><rect x="822.87" y="19" width="25.43" height="18" rx="9" fill="#F07178"/><text x="835.59" y="32" font-family="Noto Sans" font-size="11" font-weight="bold" fill="#121417" text-anchor="middle">•1</text><rect x="1262.05" y="13.5" width="101.45" height="29" rx="14.5" fill="#262C33" stroke="#373c43" stroke-width="1"/><circle cx="1273.55" cy="28" r="4" fill="#A7B0BC"/><text x="1285.55" y="32.5" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#E6E9EE">Em espera</text><rect x="1134.05" y="13.5" width="119" height="29" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><circle cx="1151.55" cy="27" r="4.5" fill="none" stroke="#A7B0BC" stroke-width="1.5"/><line x1="1155.05" y1="30.5" x2="1158.55" y2="34" stroke="#A7B0BC" stroke-width="1.5"/><text x="1169.55" y="32.5" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Ctrl+K</text><rect x="0" y="56" width="1380" height="44" fill="#121417"/><text x="36" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Estado</text><text x="120.36" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Motores</text><text x="213.18" y="83" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Recuperação</text><rect x="311.12" y="69" width="25.43" height="18" rx="9" fill="#E8B04B"/><text x="323.83" y="82" font-family="Noto Sans" font-size="11" font-weight="bold" fill="#121417" text-anchor="middle">•1</text><rect x="195.18" y="98" width="159.37" height="2" fill="#7AA2F7"/><rect x="0" y="99" width="1380" height="1" fill="#373c43"/><text x="32" y="138" font-family="Noto Sans" font-size="24" font-weight="bold" fill="#E6E9EE">Recuperação</text><text x="32" y="163" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Reinício, restauração de configuração e comandos para o terminal.</text><rect x="32.5" y="184.5" width="1315" height="39" rx="10" fill="#1B1F24" stroke="#373c43" stroke-width="1"/><text x="48" y="209" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Modo seguro: recuperação disponível</text><rect x="1232.94" y="193.5" width="102.56" height="21" rx="11" fill="#E8B04B" fill-opacity="0.14" stroke="#E8B04B" stroke-width="1" stroke-opacity="0.5"/><text x="1242.44" y="208" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#E8B04B">Pendências: 1</text><rect x="140.5" y="236.5" width="541" height="315" rx="14" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="160" y="270" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Reiniciar e restaurar</text><rect x="160.5" y="284.5" width="110.21" height="21" rx="11" fill="#A7B0BC" fill-opacity="0.14" stroke="#A7B0BC" stroke-width="1" stroke-opacity="0.5"/><text x="170" y="299" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Não necessário</text><text x="160" y="322" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Reinício exigido ao trocar a frase de despertar, mudar o feedback ou alterar</text><text x="160" y="342" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">plugins.</text><rect x="160.5" y="358.5" width="129.85" height="39" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="225.43" y="383" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Reiniciar Core</text><text x="160" y="432" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Configuração</text><text x="160" y="454" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Preserva o arquivo inválido e volta aos padrões. Depois, reinicie o Core.</text><rect x="160.5" y="492.5" width="155.93" height="39" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="238.47" y="517" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Restaurar anterior</text><rect x="325.43" y="492.5" width="283.74" height="39" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="467.3" y="517" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Preservar arquivo e restaurar padrões</text><rect x="698.5" y="236.5" width="541" height="315" rx="14" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="718" y="270" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Motor LLM e catálogo</text><text x="718" y="300" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Motor LLM</text><text x="718" y="324" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Há uma configuração boa salva: OpenRouter · modelo x</text><rect x="718.5" y="340.5" width="248.96" height="39" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="842.98" y="365" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Voltar à última configuração boa</text><text x="718" y="420" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Catálogo de plugins</text><text x="718" y="444" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Nenhum problema de armazenamento.</text><text x="718" y="468" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">O catálogo é verificado por SHA-256; o valor aparece em Desenvolvedor.</text><rect x="140.5" y="568.5" width="1099" height="423" rx="14" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="160" y="602" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Comandos no terminal</text><text x="160" y="630" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Rodam fora do aplicativo, no terminal. Troque &lt;RAIZ&gt; pelo caminho absoluto da instalação; &lt;PACOTE&gt; pelo diretório do pacote; &lt;NOME&gt; pelo nome do perfil;</text><text x="160" y="650" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">&lt;PERFIL&gt; pelo perfil criado.</text><rect x="160" y="672" width="1060" height="30" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="172" y="691" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Instalar</text><text x="276" y="692" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="13" fill="#E6E9EE">gideon-install --install-root &lt;RAIZ&gt; install &lt;PACOTE&gt;</text><rect x="1112.5" y="672.5" width="95" height="29" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1160" y="692" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Copiar</text><rect x="160" y="706" width="1060" height="30" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="172" y="725" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Atualizar</text><text x="276" y="726" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="13" fill="#E6E9EE">gideon-install --install-root &lt;RAIZ&gt; update &lt;PACOTE&gt;</text><rect x="1112.5" y="706.5" width="95" height="29" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1160" y="726" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Copiar</text><rect x="160" y="740" width="1060" height="30" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="172" y="759" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Reverter</text><text x="276" y="760" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="13" fill="#E6E9EE">gideon-install --install-root &lt;RAIZ&gt; rollback</text><rect x="1112.5" y="740.5" width="95" height="29" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1160" y="760" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Copiar</text><rect x="160" y="774" width="1060" height="30" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="172" y="793" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Reparar</text><text x="276" y="794" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="13" fill="#E6E9EE">gideon-install --install-root &lt;RAIZ&gt; repair</text><rect x="1112.5" y="774.5" width="95" height="29" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1160" y="794" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Copiar</text><rect x="160" y="808" width="1060" height="30" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="172" y="827" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Criar perfil</text><text x="276" y="828" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="13" fill="#E6E9EE">gideon-install --install-root &lt;RAIZ&gt; profile create &lt;NOME&gt;</text><rect x="1112.5" y="808.5" width="95" height="29" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1160" y="828" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Copiar</text><rect x="160" y="842" width="1060" height="30" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="172" y="861" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#A7B0BC">Abrir perfil</text><text x="276" y="862" font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-size="13" fill="#E6E9EE">gideon-launch --install-root &lt;RAIZ&gt; &lt;PERFIL&gt;</text><rect x="1112.5" y="842.5" width="95" height="29" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="1160" y="862" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Copiar</text><text x="160" y="894" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Com o Core ativo, instalar, atualizar, reverter e reparar são recusados (código de saída 3).</text><text x="160" y="914" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Se o terminal mostrar "run: gideon-install --install-root &lt;RAIZ&gt; repair", execute o comando de reparo.</text><path d="M167 934 L173 939 L167 944" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="944" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Códigos de saída</text><text x="160" y="966" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Reparo e atualização ficam no terminal: esta tela não executa instalador.</text><rect x="140.5" y="1008.5" width="1099" height="55" rx="10" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="158" y="1033" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#E6E9EE">Como funciona</text><text x="158" y="1053" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#A7B0BC">Reinícios e restaurações não apagam dados do usuário. Instalação e pacotes só pelo terminal.</text><path d="M1207 1031 L1213 1036 L1207 1041" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="0" width="1380" height="1088" fill="#121417" fill-opacity="0.6"/><rect x="410.5" y="449.5" width="559" height="189" rx="14" fill="#1B1F24" stroke="#373c43" stroke-width="1"/><text x="434" y="487" font-family="Noto Sans" font-size="18" font-weight="bold" fill="#E6E9EE">Preservar o arquivo e restaurar os padrões?</text><text x="434" y="519" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">O arquivo inválido fica guardado e as preferências voltam aos padrões.</text><text x="434" y="539" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Reinicie o Core depois.</text><rect x="780.22" y="575.5" width="165.28" height="39" rx="10" fill="#7AA2F7" stroke="#7AA2F7" stroke-width="1"/><text x="862.86" y="600" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#0B1020" text-anchor="middle">Restaurar padrões</text><rect x="672.48" y="573" width="101.24" height="44" rx="13" fill="none" stroke="#7AA2F7" stroke-width="2"/><rect x="674.98" y="575.5" width="96.24" height="39" rx="10" fill="#262C33" stroke="#7D8794" stroke-width="1" stroke-opacity="0.6"/><text x="723.1" y="600" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE" text-anchor="middle">Cancelar</text></svg>