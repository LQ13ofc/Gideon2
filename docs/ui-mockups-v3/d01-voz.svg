<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="904" viewBox="0 0 1380 904"><defs><linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1F24"/><stop offset="1" stop-color="#20262c"/></linearGradient><radialGradient id="orbBase" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#c1ceff"/><stop offset="0.5" stop-color="#7693ff"/><stop offset="1" stop-color="#3b4a80"/></radialGradient><radialGradient id="orbLobeA" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#bddeff"/><stop offset="0.5" stop-color="#6CB6FF"/><stop offset="1" stop-color="#365b80"/></radialGradient><radialGradient id="orbLobeB" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#d6defc"/><stop offset="0.5" stop-color="#a3b5f8"/><stop offset="1" stop-color="#525a7c"/></radialGradient><radialGradient id="orbErr" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#f8bfc2"/><stop offset="0.5" stop-color="#F07178"/><stop offset="1" stop-color="#78383c"/></radialGradient><radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7693ff" stop-opacity="0.45"/><stop offset="1" stop-color="#7693ff" stop-opacity="0"/></radialGradient><radialGradient id="orbGlowErr" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F07178" stop-opacity="0.45"/><stop offset="1" stop-color="#F07178" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1380" height="904" fill="#121417"/><rect x="0" y="0" width="1380" height="56" fill="#1B1F24"/><rect x="0" y="55" width="1380" height="1" fill="#373c43"/><circle cx="30" cy="28" r="18.9" fill="url(#orbGlow)"/><circle cx="30" cy="28" r="14" fill="url(#orbBase)"/><ellipse cx="27.2" cy="31.5" rx="7.7" ry="5.6" fill="url(#orbLobeA)" opacity="0.85"/><ellipse cx="34.2" cy="24.5" rx="7" ry="4.76" fill="url(#orbLobeB)" opacity="0.8"/><ellipse cx="26.5" cy="22.12" rx="4.9" ry="2.24" fill="#FFFFFF" opacity="0.28"/><text x="52" y="34" font-family="Noto Sans" font-size="16" font-weight="bold" fill="#E6E9EE">Gideon</text><g transform="translate(146 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H10l-4.5 3.5V16H4z"/></g><text x="172" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Assistente</text><g transform="translate(278.38 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g><text x="304.38" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Extensões</text><g transform="translate(409.69 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v5.5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></g><text x="435.69" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Permissões</text><rect x="535.92" y="8" width="153.33" height="40" rx="8" fill="#2b344b"/><rect x="535.92" y="53" width="153.33" height="3" rx="1.5" fill="#7693ff"/><g transform="translate(549.92 19) scale(0.75)" fill="none" stroke="#7693ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.31 10.07 L21.06 10.40 L21.06 13.60 L18.31 13.93 L17.83 15.10 L19.54 17.28 L17.28 19.54 L15.10 17.83 L13.93 18.31 L13.60 21.06 L10.40 21.06 L10.07 18.31 L8.90 17.83 L6.72 19.54 L4.46 17.28 L6.17 15.10 L5.69 13.93 L2.94 13.60 L2.94 10.40 L5.69 10.07 L6.17 8.90 L4.46 6.72 L6.72 4.46 L8.90 6.17 L10.07 5.69 L10.40 2.94 L13.60 2.94 L13.93 5.69 L15.10 6.17 L17.28 4.46 L19.54 6.72 L17.83 8.90 Z"/><circle cx="12" cy="12" r="2.8"/></g><text x="575.92" y="33" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Configurações</text><g transform="translate(707.25 19) scale(0.75)" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></g><text x="733.25" y="33" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Diagnóstico</text><rect x="1262.05" y="13.5" width="101.45" height="29" rx="14.5" fill="#262C33" stroke="#373c43" stroke-width="1"/><circle cx="1273.55" cy="28" r="4" fill="#6BCB8B"/><text x="1285.55" y="32.5" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#E6E9EE">Em espera</text><rect x="1134.05" y="13.5" width="119" height="29" rx="8" fill="#262C33" stroke="#373c43" stroke-width="1"/><circle cx="1151.55" cy="27" r="4.5" fill="none" stroke="#A7B0BC" stroke-width="1.5"/><line x1="1155.05" y1="30.5" x2="1158.55" y2="34" stroke="#A7B0BC" stroke-width="1.5"/><text x="1169.55" y="32.5" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Ctrl+K</text><rect x="0" y="56" width="1380" height="44" fill="#121417"/><text x="36" y="83" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Voz e Wake</text><rect x="18" y="98" width="116.85" height="2" fill="#7693ff"/><text x="152.85" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Áudio</text><text x="227.81" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Dispositivos</text><text x="349.59" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Aparência</text><text x="454.74" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Privacidade</text><text x="572.36" y="83" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Geral</text><rect x="0" y="99" width="1380" height="1" fill="#373c43"/><text x="32" y="138" font-family="Noto Sans" font-size="24" font-weight="bold" fill="#E6E9EE">Voz e Wake</text><text x="32" y="163" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#A7B0BC">Frase de despertar certificada, prazo da sessão e estado do wake.</text><rect x="32.5" y="184.5" width="1315" height="39" rx="10" fill="#1B1F24" stroke="#373c43" stroke-width="1"/><text x="48" y="209" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#E6E9EE">Frase ativa: Hey Gideon · em desenvolvimento · Estado do wake: Em espera</text><rect x="140.5" y="236.5" width="727" height="319" rx="10" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="160" y="270" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Frase de despertar</text><text x="160" y="292" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Só frases qualificadas podem ser escolhidas. A troca vale depois de reiniciar o Core.</text><rect x="160.5" y="306.5" width="335" height="117" rx="10" fill="#1B1F24" stroke="#7693ff" stroke-width="2"/><text x="176" y="334" font-family="Noto Sans" font-size="16" font-weight="bold" fill="#E6E9EE">Hey Gideon</text><rect x="176.5" y="342.5" width="142.02" height="21" rx="11" fill="#6CB6FF" fill-opacity="0.14" stroke="#6CB6FF" stroke-width="1" stroke-opacity="0.5"/><text x="186" y="357" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#6CB6FF">em desenvolvimento</text><text x="176" y="380" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#E6E9EE">Salva · Ativa neste processo</text><text x="176" y="398" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Qualificada em desenvolvimento; validação física</text><text x="176" y="414" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">pendente</text><g opacity="0.42"><rect x="512.5" y="306.5" width="335" height="117" rx="10" fill="#1B1F24" stroke="#373c43" stroke-width="1"/><text x="528" y="334" font-family="Noto Sans" font-size="16" font-weight="bold" fill="#E6E9EE">Okay Gideon</text><rect x="528.5" y="342.5" width="164.86" height="21" rx="11" fill="#E8B04B" fill-opacity="0.14" stroke="#E8B04B" stroke-width="1" stroke-opacity="0.5"/><text x="538" y="357" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#E8B04B">requer prova de conceito</text><text x="528" y="380" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#E6E9EE">Bloqueada: sem qualidade aprovada</text><text x="528" y="398" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Pode ser transcrita como 'K Gideon'.</text></g><rect x="160" y="440" width="688" height="105" rx="10" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="176" y="464" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Comprovado: a frase 'Hey Gideon' foi reconhecida em corpus de desenvolvimento, com verificação</text><text x="176" y="485" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">automática. Não comprovado: uso com microfone físico, em ambientes reais e com outras vozes.</text><text x="176" y="506" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Não há reconhecimento comprovado em português (pt-BR). Não é certificação acústica. 'Okay</text><text x="176" y="527" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Gideon' não tem qualidade aprovada e fica bloqueada.</text><rect x="884.5" y="236.5" width="355" height="319" rx="10" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="904" y="270" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Sessão e estado</text><text x="904" y="300" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Prazo máximo da sessão: 30 s</text><text x="904" y="336" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Estado do wake: Em espera</text><text x="904" y="372" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Captura: Em espera</text><line x1="904" y1="392" x2="1220" y2="392" stroke="#373c43" stroke-width="1"/><text x="904" y="420" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Só leitura nesta tela. O prazo pode ser editado com</text><text x="904" y="437" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Mostrar opções avançadas ligado.</text><rect x="140.5" y="572.5" width="1099" height="109" rx="10" fill="url(#cardGrad)" stroke="#373c43" stroke-width="1"/><text x="160" y="606" font-family="Noto Sans" font-size="17" font-weight="bold" fill="#E6E9EE">Ajustes de detecção</text><text x="160" y="646" font-family="Noto Sans" font-size="14" font-weight="normal" fill="#E6E9EE">Sensibilidade</text><g opacity="0.42"><rect x="340" y="645" width="360" height="6" rx="3" fill="#262C33" stroke="#373c43" stroke-width="1"/><rect x="340" y="645" width="180" height="6" rx="3" fill="#7693ff"/><circle cx="520" cy="648" r="9" fill="#1B1F24" stroke="#7693ff" stroke-width="2.5"/></g><text x="720" y="636" font-family="Noto Sans" font-size="12" font-weight="normal" fill="#A7B0BC">Indisponível: limiar de detecção fixo no pacote; o Core não tem ajuste de sensibilidade.</text><rect x="140.5" y="698.5" width="1099" height="55" rx="10" fill="#262C33" stroke="#373c43" stroke-width="1"/><text x="158" y="723" font-family="Noto Sans" font-size="15" font-weight="bold" fill="#E6E9EE">Como funciona</text><text x="158" y="743" font-family="Noto Sans" font-size="13" font-weight="normal" fill="#A7B0BC">A frase de despertar muda só entre as opções certificadas do pacote. Trocar exige reiniciar o Core.</text><path d="M1207 721 L1213 726 L1207 731" fill="none" stroke="#A7B0BC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>